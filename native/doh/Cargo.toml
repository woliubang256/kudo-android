[package]
name = "kudo-doh"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "kudo_doh"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
bytes = "1"
hickory-proto = { version = "0.24.4", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jni = { version = "0.21.1", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync"] }
tokio-rustls = { version = "0.26.4", default-features = false }
url = "2"
webpki-roots = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
