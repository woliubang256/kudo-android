name: Android Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # Tag pushes always run; path filters only restrict branch pushes.
    paths:
      - '**/*.gradle.kts'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'native/doh/Cargo.lock'
      - 'package.json'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      apk_name: ${{ steps.version.outputs.apk_name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and calculate version
        if: github.ref_type == 'tag'
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_version.py "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Signing configuration must not be persisted in a shared cache.
          cache-disabled: true

      - name: Locate native toolchain cache
        id: cache-paths
        run: |
          test -n "$ANDROID_HOME"
          printf 'sdk=%s\n' "$ANDROID_HOME" >> "$GITHUB_OUTPUT"

      - name: Restore native toolchain cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cache-paths.outputs.sdk }}/ndk/27.0.12077973
            ${{ steps.cache-paths.outputs.sdk }}/cmake/3.22.1
            ~/.rustup/toolchains/1.96.1-x86_64-unknown-linux-gnu
          key: ${{ runner.os }}-${{ runner.arch }}-native-v1-rust-1.96.1-arm64-ndk-27.0.12077973-cmake-3.22.1

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-release-deps-v2-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'native/doh/Cargo.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-deps-v2-
            ${{ runner.os }}-${{ runner.arch }}-release-deps-v1-

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false

      - name: Set up Rust
        env:
          RUST_VERSION: '1.96.1'
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Save native toolchain cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cache-paths.outputs.sdk }}/ndk/27.0.12077973
            ${{ steps.cache-paths.outputs.sdk }}/cmake/3.22.1
            ~/.rustup/toolchains/1.96.1-x86_64-unknown-linux-gnu
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify decision notes
        run: npm run verify-notes

      - name: Test native DoH
        run: cargo test --locked --manifest-path native/doh/Cargo.toml --lib

      - name: Unit tests and Android Lint
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --no-configuration-cache --console=plain

      - name: Upload failing JVM test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failure-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
          archive: true

      - name: Restore release keystore
        if: github.ref_type == 'tag'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: python3 scripts/prepare_release.py restore --output "$RUNNER_TEMP/kudo-signing/release.p12"

      - name: Build signed release
        if: github.ref_type == 'tag'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/kudo-signing/release.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
            value="${!name:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::$name is required for CI Sentry mapping upload."
              exit 1
            fi
          done
          bash ./gradlew :app:verifySentryBuild :app:assembleRelease \
            "-PsentryCiUpload=true" \
            "-PversionName=$VERSION_NAME" "-PversionCode=$VERSION_CODE" \
            --no-daemon --no-configuration-cache --no-build-cache --console=plain

      - name: Verify signature and APK version, then create checksum
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/kudo-signing/release.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: >-
          python3 scripts/prepare_release.py package
          --apk app/build/outputs/apk/release/app-release.apk
          --tag "$RELEASE_TAG"
          --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --output-dir "$RUNNER_TEMP/kudo-release-dist"

      - name: Remove temporary signing key
        if: always() && github.ref_type == 'tag'
        run: rm -f -- "$RUNNER_TEMP/kudo-signing/release.p12"

      - name: Organize release notes from commits
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$RELEASE_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/published-releases.json"
          python3 scripts/release_notes.py --tag "$RELEASE_TAG" \
            --repository "$RELEASE_REPOSITORY" \
            --published-releases "$RUNNER_TEMP/published-releases.json" \
            --prepared-notes-dir release-notes \
            --raw-output "$RUNNER_TEMP/kudo-release-dist/release-notes.raw.md" \
            --output "$RUNNER_TEMP/kudo-release-dist/release-notes.md"

      - name: Upload verified release files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/kudo-release-dist/*.apk
            ${{ runner.temp }}/kudo-release-dist/*.sha256
            ${{ runner.temp }}/kudo-release-dist/release-notes.md
            ${{ runner.temp }}/kudo-release-dist/release-notes.raw.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          archive: true

      - name: Save dependency cache
        if: success() && steps.dependency-cache.outcome == 'success' && steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm/_cacache
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist
          skip-decompress: false
          digest-mismatch: error

      - name: Publish GitHub Release
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          sha256sum --check --strict "$APK_NAME.sha256"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != "true" ]]; then
              echo "This tag already has a published release. Use a new version tag."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "酷DO $VERSION_NAME" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
